groups:
  - name: taskflow-api
    rules:
      - alert: ApiDown
        expr: up{job="taskflow-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: 'TaskFlow API fora do ar'
          description: 'O Prometheus não consegue fazer scrape de {{ $labels.instance }} há mais de 1 minuto.'

      - alert: HighErrorRate5xx
        expr: |
          sum(rate(http_requests_total{status_code=~"5.."}[5m]))
          /
          sum(rate(http_requests_total[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'Taxa de erros 5xx acima de 5%'
          description: 'Mais de 5% das respostas nos últimos 5 minutos foram 5xx.'

      - alert: HighLatencyP95
        expr: |
          histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le)) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'Latência p95 acima de 1s'
          description: 'O percentil 95 de latência das requisições está acima de 1 segundo nos últimos 5 minutos.'
