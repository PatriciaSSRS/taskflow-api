name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Lint, testes e build
    runs-on: self-hosted

    env:
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: 5433
      DB_USER: taskflow
      DB_PASSWORD: taskflow
      DB_NAME: taskflow

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Subir PostgreSQL de teste
        run: |
          docker rm -f taskflow-ci-db 2>/dev/null || true
          docker run -d --name taskflow-ci-db \
            -e POSTGRES_USER=taskflow \
            -e POSTGRES_PASSWORD=taskflow \
            -e POSTGRES_DB=taskflow \
            -p 5433:5432 \
            postgres:16-alpine
          for i in $(seq 1 30); do
            if docker exec taskflow-ci-db pg_isready -h 127.0.0.1 -U taskflow; then
              exit 0
            fi
            sleep 2
          done
          echo "PostgreSQL não subiu a tempo" && exit 1

      - name: Instalar dependências
        run: npm ci

      - name: Rodar lint
        run: npm run lint

      - name: Rodar testes automatizados (com cobertura)
        run: npm run test:cov

      - name: Build da aplicação
        run: npm run build

      - name: Build da imagem Docker
        run: docker build -t taskflow-api:${{ github.sha }} .

      - name: Derrubar PostgreSQL de teste
        if: always()
        run: docker rm -f taskflow-ci-db || true
